# Github actions workflow 
# Github automatically looks for workflow file inside .github/workflows/

#give workflow a meaning full name
name: Iris ML API - CI Pipeline

on:
    push:
      branches:
          - main
    pull_request:
      branches:
          - main


# permissions  are restricted tot reading repo content only
permissions:
    contents: read
  
jobs:
     test-and-build:
     # Github provides a fresh Ubuntu VM for this job 
     runs-on: ubuntu-latest

     #steps
     steps:
       - name: Checkout out repo
         uses: actions/checkout@v4
         
         #step 2- Install Python on runner 
       - name: Install Python on Runner
         uses: actions/setup-python@v5
         with:
           python-version: "3.14"
         
         #step 3- Install dependencies
       - name: Install Python  dependencies
         run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
         
         #step 4- Run tests
       - name: Run automated tests
          run: python -m pytest -v

        #step 5- Build docker image
       - name: Build docker image
         run: docker build -t iris-ml-api:${{ github.sha }} .

         